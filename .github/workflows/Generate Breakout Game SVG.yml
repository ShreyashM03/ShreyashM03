name: Generate Breakout Game SVG

on:
  schedule:
    # Runs automatically every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run this manually at any time
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Breakout SVG
        # Using the official github-breakout action marketplace utility
        uses: cyprieng/github-breakout@v1 
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: ./output/

      - name: Deploy SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
